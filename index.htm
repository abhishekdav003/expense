<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignUp</title>
</head>
<body>
  <h2>User Signup</h2>

  <form id="signupform">

    <label for="">Name:</label>
    <input type="text" id="name" required>
    <br><br>

    <label for="">Email:</label>
    <input type="email" id="email" required>

    <br><br>

    <label for="">Password:</label>
    <input type="password" id="password" required>

    <br><br>
    <button type="submit">SignUp</button>
  </form>
  <p id="message"></p>

  <hr>

  <h2>User Login</h2>

  <form id="loginform">

    <label for="">Email:</label>
    <input type="email" name="" id="loginemail" required>
    <br><br>
    <label for="">Password:</label>
    <input type="password" name="" id="loginpassword" required><br><br>
    <button type="submit">Login</button>
  </form>
  <p id="loginmessage"></p>

  <script>
    const form = document.getElementById("signupform")
    const message = document.getElementById("message")

    form.addEventListener("submit", async (event) => {
      event.preventDefault()

      const name = document.getElementById("name").value
      const email =  document.getElementById("email").value
      const password = document.getElementById("password").value

      try{
        const response = await fetch(
          "http://localhost:3000/user/signup",
          {
            method:"POST",
            headers:{
              "Content-Type":"application/json"
            },
            body: JSON.stringify({
              name, email, password
            })
          }
        )
        const data = await response.json()

        message.innerText = data.message

        if(data.success){
          form.reset()
        }
      }catch(error){
        message.innerText = "Somthing went wrong"
        console.error(error)
      }

      
    })

    const loginform = document.getElementById("loginform")
    loginform.addEventListener("submit", async(event)=>{
      event.preventDefault()

      const email = document.getElementById("loginemail").value
      const password = document.getElementById("loginpassword").value

      try{
        const response = await fetch(
          "http://localhost:3000/user/login",{
            method:"POST",
            headers:{
              "Content-Type" : "application/json"
            },

            body: JSON.stringify({
              email,
              password
            })
          }
        )
        const data = await response.json()

        document.getElementById("loginmessage").innerText = data.message

        if(data.success){
          loginform.reset()
        }
      }catch(error){
        document.getElementById("loginmessage").innerText = "Something went wromg"
      }
    })

  </script>
  
</body>
</html>
