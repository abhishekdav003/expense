<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignUp</title>
</head>
<body>
  <div id="authsection">
  <h2>User Signup</h2>

  <form id="signupform">

    <label for="">Name:</label>
    <input type="text" id="name" required>
    <br><br>

    <label for="">Email:</label>
    <input type="email" id="email" required>

    <br><br>

    <label for="">Password:</label>
    <input type="password" id="password" required>

    <br><br>
    <button type="submit">SignUp</button>
  </form>
  <p id="message"></p>

  <hr>

  <h2>User Login</h2>

  <form id="loginform">

    <label for="">Email:</label>
    <input type="email" name="" id="loginemail" required>
    <br><br>
    <label for="">Password:</label>
    <input type="password" name="" id="loginpassword" required><br><br>
    <button type="submit">Login</button>
  </form>
  <p id="loginmessage"></p>

</div>

  <hr>

  <div id="expensedashboard" style="display: none;">
    <h2>Expense Dashboard</h2>
    <button id="logoutbutton"> Logout</button>

    <br>
    <br>
    <h3>Add expense</h3>
    <form action="" id="expenseform">

      <label for="">Amount:</label>
      <input type="number" name="" id="amount" required>

      <br><br>

      <label for="">Description:</label>
      <input type="text" id="description" required>

      <br><br>
      <label for="">Category:</label>
      <select name="" id="category" required>
        <option value="">Select Category</option>
        <option value="Food">Food</option>
        <option value="Petrol">Petrol</option>
        <option value="Salary">Salary</option>
        <option value="Shopping">Shopping</option>
        <option value="Other">Other</option>
      </select>

      <br><br>

      <button type="submit">Add Expense</button>
    </form>

    <p id="expensemessage"></p>
    <hr>
    <h3>Your Expense</h3>
    <table border="1">

      <thead>
        <tr>
          <th>Amount</th>
          <th>Description</th>
          <th>Category</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="expenselist"></tbody>
    </table>

  </div>

  <script>
    const form = document.getElementById("signupform")
    const message = document.getElementById("message")

    form.addEventListener("submit", async (event) => {
      event.preventDefault()

      const name = document.getElementById("name").value
      const email =  document.getElementById("email").value
      const password = document.getElementById("password").value

      try{
        const response = await fetch(
          "http://localhost:3000/user/signup",
          {
            method:"POST",
            headers:{
              "Content-Type":"application/json"
            },
            body: JSON.stringify({
              name, email, password
            })
          }
        )
        const data = await response.json()

        message.innerText = data.message

        if(data.success){
          form.reset()
        }
      }catch(error){
        message.innerText = "Somthing went wrong"
        console.error(error)
      }

      
    })

    const loginform = document.getElementById("loginform")
    loginform.addEventListener("submit", async(event)=>{
      event.preventDefault()

      const email = document.getElementById("loginemail").value
      const password = document.getElementById("loginpassword").value

      try{
        const response = await fetch(
          "http://localhost:3000/user/login",{
            method:"POST",
            headers:{
              "Content-Type" : "application/json"
            },

            body: JSON.stringify({
              email,
              password
            })
          }
        )
        const data = await response.json()

        document.getElementById("loginmessage").innerText = data.message

        if(data.success){

          localStorage.setItem("token", data.token)
          loginform.reset()
          document.getElementById("authsection").style.display = "none"

          document.getElementById("loginmessage").innerText = "Login Successful"
        }
      }catch(error){
        document.getElementById("loginmessage").innerText = "Something went wromg"
      }
    })

    const token = localStorage.getItem("token")

    if(token){
      document.getElementById("authsection").style.display = "none"
      document.getElementById("expensedashboard").style.display = "block"
      getExpenses();
    }
    

    const logoutButton = document.getElementById("logoutbutton");

      logoutButton.addEventListener("click", () => {

        localStorage.removeItem("token");

        document.getElementById("expensedashboard").style.display = "none";

        document.getElementById("authsection").style.display = "block";

      });

      const expenseForm = document.getElementById("expenseform");

        expenseForm.addEventListener("submit", async (event) => {

          event.preventDefault();

          const amount = document.getElementById("amount").value;
          const description = document.getElementById("description").value;
          const category = document.getElementById("category").value;

          const token = localStorage.getItem("token");

          try {

            const response = await fetch(
              "http://localhost:3000/expense",
              {
                method: "POST",

                headers: {
                  "Content-Type": "application/json",

                  "Authorization": `Bearer ${token}`
                },

                body: JSON.stringify({
                  amount,
                  description,
                  category
                })
              }
            );

            const data = await response.json();

            document.getElementById("expensemessage").innerText =
              data.message;

            if (data.success) {
              expenseForm.reset();
            }

          } catch (error) {

            document.getElementById("expensemessage").innerText =
              "Something went wrong";

            console.error(error);
          }

        });
        async function getExpenses() {

            const token = localStorage.getItem("token");

            try {

              const response = await fetch(
                "http://localhost:3000/expense",
                {
                  method: "GET",

                  headers: {
                    "Authorization": `Bearer ${token}`
                  }
                }
              );

              const data = await response.json();

              const expenseList = document.getElementById("expenselist");

              expenseList.innerHTML = "";

              if (data.success) {

                data.data.forEach((expense) => {

                  const row = document.createElement("tr");

                  row.innerHTML = `
          <td>${expense.amount}</td>
          <td>${expense.description}</td>
          <td>${expense.category}</td>
          <td>
  <button onclick="deleteExpense(${expense.id})">
    Delete
  </button>
</td>
        `;

                  expenseList.appendChild(row);

                });

              }

            } catch (error) {

              console.error("Error fetching expenses:", error);

            }

          }
          async function deleteExpense(expenseId) {

              const token = localStorage.getItem("token");

              try {

                const response = await fetch(
                  `http://localhost:3000/expense/${expenseId}`,
                  {
                    method: "DELETE",

                    headers: {
                      "Authorization": `Bearer ${token}`
                    }
                  }
                );

                const data = await response.json();

                if (data.success) {

                  document.getElementById("expensemessage").innerText =
                    data.message;

                  getExpenses();

                } else {

                  document.getElementById("expensemessage").innerText =
                    data.message;

                }

              } catch (error) {

                console.error("Error deleting expense:", error);

                document.getElementById("expensemessage").innerText =
                  "Something went wrong";

              }

            }
  </script>
  
</body>
</html>
